<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>procm room console</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Room console</h1>
        <p id="identity">Connecting...</p>
      </div>
      <div class="connection"><span id="status-dot"></span><span id="status">connecting</span></div>
    </header>
    <main>
      <section class="controls" aria-label="Room controls">
        <button id="wait-ready" type="button">Wait for backend</button>
        <button id="ping" type="button">Send ping</button>
        <button id="sample-logs" type="button">Emit log sample</button>
        <button id="clear" class="secondary" type="button" aria-label="Clear event output" title="Clear event output">Clear</button>
      </section>
      <section class="status-band">
        <div><span>Backend</span><strong id="backend">unknown</strong></div>
        <div><span>Round trips</span><strong id="roundtrips">0</strong></div>
        <div><span>Members seen</span><strong id="members">0</strong></div>
      </section>
      <section class="stream" aria-label="Room event stream">
        <div class="stream-head"><h2>Events</h2><span>live</span></div>
        <ol id="events"></ol>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
