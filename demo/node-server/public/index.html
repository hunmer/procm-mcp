<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>procm backend console</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101114; color: #f1f3f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #101114; }
      header { min-height: 76px; padding: 14px 24px; border-bottom: 1px solid #2a2d33; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #15171b; }
      h1, h2, p { margin: 0; letter-spacing: 0; }
      h1 { font-size: 18px; font-weight: 650; }
      header p { margin-top: 4px; color: #8e949d; font: 12px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
      .connection { display: flex; align-items: center; gap: 8px; color: #b8bdc5; font-size: 13px; white-space: nowrap; }
      #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #e6a23c; box-shadow: 0 0 0 3px rgba(230,162,60,.12); }
      #status-dot.open { background: #38c172; box-shadow: 0 0 0 3px rgba(56,193,114,.12); }
      #status-dot.closed { background: #e05252; box-shadow: 0 0 0 3px rgba(224,82,82,.12); }
      main { display: grid; grid-template-rows: auto auto minmax(240px, 1fr); }
      .controls { padding: 14px 24px; border-bottom: 1px solid #272a30; display: flex; gap: 8px; align-items: center; }
      button { min-height: 34px; padding: 0 13px; border: 1px solid #3d67d8; border-radius: 6px; background: #315cc9; color: white; font: 600 12px/1 system-ui, sans-serif; cursor: pointer; }
      button:hover { background: #3a68df; }
      button:disabled { cursor: wait; opacity: .65; }
      button:focus-visible { outline: 2px solid #8eafff; outline-offset: 2px; }
      .status-band { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid #272a30; background: #131519; }
      .status-band div { min-height: 72px; padding: 14px 24px; border-right: 1px solid #272a30; display: flex; flex-direction: column; justify-content: center; gap: 7px; min-width: 0; }
      .status-band div:last-child { border-right: 0; }
      .status-band span { color: #858b95; font-size: 11px; text-transform: uppercase; }
      .status-band strong { font: 600 15px/1.25 ui-monospace, SFMono-Regular, Consolas, monospace; color: #e6e9ee; overflow-wrap: anywhere; }
      .content { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); min-height: 0; }
      .output, .method { min-width: 0; padding: 18px 24px; }
      .output { border-right: 1px solid #272a30; }
      h2 { margin-bottom: 12px; font-size: 13px; }
      pre { margin: 0; min-height: 180px; padding: 14px; border: 1px solid #2a2d33; border-radius: 6px; background: #0c0d10; color: #c9cdd4; font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      #method-source { color: #8fb1ff; }
      @media (max-width: 760px) {
        header { align-items: flex-start; padding: 14px; }
        .controls, .output, .method { padding-left: 14px; padding-right: 14px; }
        .status-band { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .status-band div { padding: 12px 14px; border-bottom: 1px solid #272a30; }
        .content { grid-template-columns: 1fr; }
        .output { border-right: 0; border-bottom: 1px solid #272a30; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Backend console</h1>
        <p id="identity">Connecting...</p>
      </div>
      <div class="connection"><span id="status-dot"></span><span id="status">connecting</span></div>
    </header>
    <main>
      <section class="controls" aria-label="Backend controls">
        <button id="load-electron" type="button">获取 Electron 数据</button>
      </section>
      <section class="status-band">
        <div><span>Electron</span><strong id="electron-status">unknown</strong></div>
        <div><span>Backend</span><strong id="electron-backend">unknown</strong></div>
        <div><span>Round trips</span><strong id="electron-roundtrips">0</strong></div>
        <div><span>UI value</span><strong id="electron-ui-value">unknown</strong></div>
      </section>
      <section class="content">
        <div class="output">
          <h2>Electron data</h2>
          <pre id="output">等待获取数据</pre>
        </div>
        <div class="method">
          <h2>HTML request method</h2>
          <pre id="method-source"></pre>
        </div>
      </section>
    </main>
    <script>
      async function loadElectronData() {
        const button = document.querySelector("#load-electron");
        button.disabled = true;
        try {
          const response = await fetch("/api/electron-data");
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
          const data = result.electron;
          document.querySelector("#electron-status").textContent = data.status ?? "unknown";
          document.querySelector("#electron-backend").textContent = data.backend ?? "unknown";
          document.querySelector("#electron-roundtrips").textContent = data.roundtrips ?? "0";
          document.querySelector("#electron-ui-value").textContent = data.uiValue ?? "null";
          document.querySelector("#output").textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          document.querySelector("#output").textContent = String(error);
        } finally {
          button.disabled = false;
        }
      }

      document.querySelector("#load-electron").addEventListener("click", loadElectronData);
      document.querySelector("#method-source").textContent = loadElectronData.toString();
      fetch("/api/snapshot").then((response) => response.json()).then((snapshot) => {
        document.querySelector("#identity").textContent = `${snapshot.roomId} / ${snapshot.memberId}`;
        document.querySelector("#status").textContent = snapshot.state;
        document.querySelector("#status-dot").className = snapshot.state;
      });
    </script>
  </body>
</html>
