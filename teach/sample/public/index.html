<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>procm-mcp 调试练习</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f5f7;
        color: #1f2328;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(640px, calc(100% - 32px));
        padding: 28px;
        box-sizing: border-box;
        background: #ffffff;
        border: 1px solid #d8dee4;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgb(31 35 40 / 8%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0 0 20px;
        color: #59636e;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 16px;
        background: #0969da;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      pre {
        min-height: 120px;
        margin: 20px 0 0;
        padding: 16px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #d8dee4;
        border-radius: 6px;
        background: #f6f8fa;
        color: #24292f;
      }

      pre.error {
        border-color: #cf222e;
        background: #fff8f8;
        color: #82071e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>购物车计算</h1>
      <p>点击按钮，请求后端计算购物车总价。</p>
      <button id="calculate" type="button">计算总价</button>
      <pre id="result" aria-live="polite">等待请求</pre>
    </main>

    <script>
      const button = document.querySelector("#calculate");
      const result = document.querySelector("#result");

      button.addEventListener("click", async () => {
        button.disabled = true;
        result.className = "";
        result.textContent = "请求中...";

        try {
          const response = await fetch("/api/calculate");
          const body = await response.json();
          result.classList.toggle("error", !response.ok);
          result.textContent = JSON.stringify(body, null, 2);
        } catch (error) {
          result.className = "error";
          result.textContent = `请求失败：${error.message}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
