name: Type Check
on:
  push:
    branches: ["main"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - run: npm ci --prefix dashboard
      - run: npm ci --ignore-scripts
      - name: Type-check SDK
        run: npm --prefix packages/procm-sdk exec tsc -- --noEmit
      - name: Type-check dashboard
        run: npm --prefix dashboard exec tsc -- --noEmit
      - name: Type-check server
        run: npx tsc --noEmit
